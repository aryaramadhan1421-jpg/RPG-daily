<!-- =========================================================================
     INTEGRATION SNIPPETS FOR index.html (SYSTEM RPG BY ARYA)
     ========================================================================= -->

<!-- 1. GANTI TOMBOL FINGERPRINT DI #system-splash-screen DENGAN BLOK INI: -->
<div style="margin-top: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
    <div class="flex items-center gap-2" style="font-size: 11px;">
        <label style="color: #94a3b8; display: flex; align-items: center; gap: 4px; cursor: pointer;">
            <input type="checkbox" id="fp-music-enabled" checked onchange="toggleFingerprintMusicSetting(this.checked)">
            <span data-i18n="fp_music_toggle">Biometric Audio</span>
        </label>
        <select id="fp-music-track" onchange="setFingerprintMusicTrack(this.value)" class="input-cyber" style="padding: 2px 6px; font-size: 10px; width: auto;">
            <option value="cyber">🌌 Cyber Gate</option>
            <option value="ethereal">✨ Awakening Choir</option>
            <option value="custom">🎵 Custom MP3</option>
        </select>
        <button type="button" id="btn-fp-upload-mp3" onclick="document.getElementById('fp-custom-mp3-input').click()" class="hidden" style="font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #1e293b; color: #67e8f9; border: 1px solid #334155;">📂</button>
        <input type="file" id="fp-custom-mp3-input" accept="audio/*" onchange="loadFingerprintCustomMp3(event)" class="hidden">
    </div>

    <button type="button" id="btn-fingerprint-auth" class="fingerprint-pad" aria-label="Tahan Sidik Jari untuk Masuk">
        <div class="fingerprint-scan-line" id="fp-scan-line"></div>
        <div id="fp-hold-ring" style="position: absolute; inset: -4px; border-radius: 50%; border: 3px solid transparent; transition: border-color 0.15s;"></div>
        <svg id="fp-svg-icon" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 4"/>
            <path d="M5 19.5C5.5 18 6 15 6 12c0-.7.12-1.37.34-2"/>
            <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
            <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
            <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
            <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
            <path d="M2 16h.01"/>
            <path d="M21.8 16c.2-2 .131-5.354 0-6"/>
            <path d="M9 6.8a6 6 0 0 1 9 5.2c0 .47 0 1.17-.02 2"/>
        </svg>
    </button>
    <audio id="fp-custom-audio" preload="auto" class="hidden"></audio>
</div>

<!-- 2. TAMBAHKAN PIE CHART FINANCIAL ANALYTICS DI #tab-status: -->
<div class="system-card space-y-3" id="dashboard-finance-card" style="border-color: rgba(34,211,238,0.35);">
    <div class="flex items-center justify-between" style="border-bottom: 1px solid var(--bg-slate-800); padding-bottom: 0.5rem;">
        <h3 class="font-display flex items-center gap-1-5" style="font-weight: 700; font-size: 0.875rem; text-transform: uppercase; color: var(--cyan-400);" data-i18n="dash_fin_title">
            💰 Financial Analytics
        </h3>
        <div class="flex gap-1">
            <button type="button" onclick="setDashFinancePeriod('today')" id="df-period-today" class="df-period-btn font-display" style="font-size: 9px; padding: 3px 6px; border-radius: 4px; background: rgba(6,182,212,0.2); color: #67e8f9; border: 1px solid rgba(6,182,212,0.4);" data-i18n="period_today">Hari Ini</button>
            <button type="button" onclick="setDashFinancePeriod('week')" id="df-period-week" class="df-period-btn font-display" style="font-size: 9px; padding: 3px 6px; border-radius: 4px; background: var(--bg-slate-900); color: #94a3b8; border: 1px solid #334155;" data-i18n="period_week">Minggu Ini</button>
            <button type="button" onclick="setDashFinancePeriod('month')" id="df-period-month" class="df-period-btn font-display" style="font-size: 9px; padding: 3px 6px; border-radius: 4px; background: var(--bg-slate-900); color: #94a3b8; border: 1px solid #334155;" data-i18n="period_month">Bulan Ini</button>
            <button type="button" onclick="setDashFinancePeriod('custom')" id="df-period-custom" class="df-period-btn font-display" style="font-size: 9px; padding: 3px 6px; border-radius: 4px; background: var(--bg-slate-900); color: #94a3b8; border: 1px solid #334155;" data-i18n="period_custom">Custom</button>
        </div>
    </div>

    <div id="df-custom-date-box" class="hidden grid grid-cols-2 gap-2">
        <input type="date" id="df-start-date" onchange="renderDashboardFinance()" class="input-cyber" style="font-size: 11px; padding: 4px 6px;">
        <input type="date" id="df-end-date" onchange="renderDashboardFinance()" class="input-cyber" style="font-size: 11px; padding: 4px 6px;">
    </div>

    <div class="grid grid-cols-3 gap-1-5 text-center">
        <div style="background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); border-radius: 0.6rem; padding: 0.45rem;">
            <span style="font-size: 9px; color: #94a3b8; display: block;" data-i18n="fin_income">Pemasukan</span>
            <span id="df-total-in" class="font-display" style="font-size: 11px; font-weight: 800; color: #34d399;">Rp 0</span>
        </div>
        <div style="background: rgba(244,63,94,0.1); border: 1px solid rgba(244,63,94,0.3); border-radius: 0.6rem; padding: 0.45rem;">
            <span style="font-size: 9px; color: #94a3b8; display: block;" data-i18n="fin_expense">Pengeluaran</span>
            <span id="df-total-out" class="font-display" style="font-size: 11px; font-weight: 800; color: #fb7185;">Rp 0</span>
        </div>
        <div style="background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.3); border-radius: 0.6rem; padding: 0.45rem;">
            <span style="font-size: 9px; color: #94a3b8; display: block;" data-i18n="fin_net">Saldo Bersih</span>
            <span id="df-net-bal" class="font-display" style="font-size: 11px; font-weight: 800; color: #22d3ee;">Rp 0</span>
        </div>
    </div>

    <div class="flex items-center gap-3">
        <div id="df-pie-chart-wrap" style="width: 120px; height: 120px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;"></div>
        <div id="df-category-legend" class="flex-1 space-y-1-5 min-w-0"></div>
    </div>
    <div id="df-selected-cat-txs" class="hidden space-y-1-5" style="padding-top: 0.5rem; border-top: 1px dashed #334155;"></div>
</div>

<!-- 3. MODAL KONFIRMASI ABANDON DUNGEON: -->
<div id="modal-dungeon-abandon" class="hidden" style="position: fixed; inset: 0; z-index: 80; background: rgba(2,6,23,0.85); display: flex; align-items: center; justify-content: center; padding: 1rem;">
    <div class="system-card modal-enter space-y-3" style="width: 100%; max-width: 21rem; border-color: #f43f5e; box-shadow: 0 0 24px rgba(244,63,94,0.35);">
        <h3 class="font-display" style="font-weight: 800; font-size: 1rem; color: #fb7185; text-transform: uppercase;">⚠️ DUNGEON GATE WARNING</h3>
        <p id="dungeon-abandon-question" style="font-size: 0.85rem; color: #f1f5f9; line-height: 1.5;" data-i18n="dungeon_abandon_q">
            Are you sure you want to abandon this dungeon?
        </p>
        <p style="font-size: 11px; color: #fda4af;" data-i18n="dungeon_abandon_penalty">
            Membatalkan misi fokus akan memberikan penalti -10 HP.
        </p>
        <div class="grid grid-cols-2 gap-2" style="padding-top: 0.25rem;">
            <button type="button" onclick="closeModal('modal-dungeon-abandon')" class="font-display" style="padding: 0.6rem; border-radius: 0.65rem; background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.5); font-weight: 700; font-size: 0.75rem;" data-i18n="btn_continue_dungeon">
                Continue Dungeon
            </button>
            <button type="button" onclick="confirmAbandonDungeon()" class="font-display" style="padding: 0.6rem; border-radius: 0.65rem; background: #e11d48; color: #fff; font-weight: 700; font-size: 0.75rem;" data-i18n="btn_abandon_dungeon">
                Abandon Dungeon
            </button>
        </div>
    </div>
</div>

<!-- 4. MODAL EDIT / DETAIL TRANSAKSI TREASURY: -->
<div id="modal-edit-tx" class="hidden" style="position: fixed; inset: 0; z-index: 80; background: rgba(2,6,23,0.85); display: flex; align-items: center; justify-content: center; padding: 1rem;">
    <form onsubmit="saveEditedTreasuryTx(event)" class="system-card modal-enter space-y-3" style="width: 100%; max-width: 22rem; border-color: #22d3ee;">
        <div class="flex justify-between items-center">
            <h3 class="font-display" style="font-weight: 700; font-size: 0.9rem; color: #22d3ee;" data-i18n="tx_edit_title">Detail & Edit Transaksi</h3>
            <span id="edit-tx-created-at" style="font-size: 10px; color: #94a3b8;">-</span>
        </div>
        <input type="hidden" id="edit-tx-id">
        <div class="grid grid-cols-2 gap-2">
            <div>
                <label style="font-size: 11px; color: #cbd5e1; display: block; margin-bottom: 3px;" data-i18n="tx_type_lbl">Jenis</label>
                <select id="edit-tx-type" onchange="updateEditTreasuryCategoryOptions()" class="input-cyber" style="font-size: 12px;">
                    <option value="expense" data-i18n="opt_expense">📤 Pengeluaran (-)</option>
                    <option value="income" data-i18n="opt_income">📥 Pemasukan (+)</option>
                </select>
            </div>
            <div>
                <label style="font-size: 11px; color: #cbd5e1; display: block; margin-bottom: 3px;" data-i18n="tx_date_lbl">Tanggal Transaksi</label>
                <input type="date" id="edit-tx-date" required class="input-cyber" style="font-size: 12px;">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
            <div>
                <label style="font-size: 11px; color: #cbd5e1; display: block; margin-bottom: 3px;" data-i18n="tx_amount_lbl">Nominal (Rp)</label>
                <input type="number" id="edit-tx-amount" min="1" required class="input-cyber font-display" style="font-size: 12px;">
            </div>
            <div>
                <label style="font-size: 11px; color: #cbd5e1; display: block; margin-bottom: 3px;" data-i18n="tx_cat_lbl">Kategori</label>
                <select id="edit-tx-category" class="input-cyber" style="font-size: 12px;"></select>
            </div>
        </div>
        <div>
            <label style="font-size: 11px; color: #cbd5e1; display: block; margin-bottom: 3px;" data-i18n="tx_name_lbl">Nama Transaksi</label>
            <input type="text" id="edit-tx-name" required class="input-cyber" style="font-size: 12px;">
        </div>
        <div>
            <label style="font-size: 11px; color: #cbd5e1; display: block; margin-bottom: 3px;" data-i18n="tx_note_lbl">Catatan Tambahan (Opsional)</label>
            <input type="text" id="edit-tx-note" class="input-cyber" style="font-size: 12px;">
        </div>
        <div class="flex gap-2">
            <button type="button" onclick="confirmDeleteCurrentTx()" class="font-display" style="padding: 0.55rem 0.75rem; border-radius: 0.6rem; background: rgba(244,63,94,0.2); color: #fda4af; border: 1px solid rgba(244,63,94,0.45); font-size: 11px; font-weight: 700;">🗑️</button>
            <button type="button" onclick="closeModal('modal-edit-tx')" class="flex-1 font-display" style="padding: 0.55rem; border-radius: 0.6rem; background: var(--bg-slate-900); color: #cbd5e1; border: 1px solid #334155; font-size: 11px; font-weight: 700;" data-i18n="btn_cancel">Batal</button>
            <button type="submit" class="flex-1 font-display" style="padding: 0.55rem; border-radius: 0.6rem; background: var(--cyan-500); color: #020617; font-size: 11px; font-weight: 700;" data-i18n="btn_save">Simpan</button>
        </div>
    </form>
</div>

<!-- 5. SPOTLIGHT ONBOARDING TUTORIAL OVERLAY: -->
<div id="onboarding-overlay" class="hidden" style="position: fixed; inset: 0; z-index: 95; background: rgba(2,6,23,0.82); backdrop-filter: blur(2px); display: flex; flex-direction: column; justify-content: flex-end; padding: 1.25rem;">
    <div id="onboarding-spotlight-ring" style="position: fixed; border: 2px solid #22d3ee; border-radius: 0.85rem; box-shadow: 0 0 0 9999px rgba(2,6,23,0.72), 0 0 22px rgba(34,211,238,0.65); pointer-events: none; transition: all 0.3s ease;"></div>
    <div class="system-card modal-enter space-y-3" style="position: relative; z-index: 96; max-width: 24rem; margin: 0 auto; width: 100%; border-color: #22d3ee;">
        <div class="flex items-center justify-between">
            <span id="tut-step-badge" class="font-display" style="font-size: 10px; font-weight: 800; color: #67e8f9; background: rgba(6,182,212,0.18); padding: 2px 8px; border-radius: 9999px;">STEP 1 / 7</span>
            <button type="button" onclick="finishOnboardingTutorial()" style="font-size: 11px; color: #94a3b8; text-decoration: underline;" data-i18n="tut_skip">Skip</button>
        </div>
        <h3 id="tut-title" class="font-display" style="font-size: 1rem; font-weight: 800; color: #fff;">Dashboard & Status</h3>
        <p id="tut-desc" style="font-size: 0.8rem; color: #cbd5e1; line-height: 1.5;">-</p>
        <div class="flex items-center justify-between gap-2" style="padding-top: 0.25rem;">
            <button type="button" id="tut-btn-prev" onclick="prevTutorialStep()" class="font-display" style="padding: 0.5rem 0.85rem; border-radius: 0.6rem; background: var(--bg-slate-900); color: #cbd5e1; border: 1px solid #334155; font-size: 11px; font-weight: 700;" data-i18n="tut_prev">Previous</button>
            <button type="button" id="tut-btn-next" onclick="nextTutorialStep()" class="font-display" style="flex: 1; padding: 0.55rem 0.85rem; border-radius: 0.6rem; background: linear-gradient(to right, #06b6d4, #9333ea); color: #fff; font-size: 11px; font-weight: 700;" data-i18n="tut_next">Next</button>
        </div>
    </div>
</div>

<!-- 6. TOMBOL REPLAY TUTORIAL DI DALAM #font-settings-modal: -->
<button type="button" onclick="closeFontSettingsModal(); startOnboardingTutorial(true);" class="w-full font-display" style="margin-top: 0.5rem; padding: 0.55rem; border-radius: 0.65rem; background: rgba(168,85,247,0.2); color: #e9d5ff; border: 1px solid rgba(192,132,252,0.45); font-size: 11px; font-weight: 700;">
    🎓 Replay Tutorial
</button>

<!-- 7. SCRIPT TAG DI BAGIAN PALING BAWAH <body> (HAPUS i18n_engine.js): -->
<script src="app.js"></script>

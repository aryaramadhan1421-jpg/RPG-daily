name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Otomatis
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          GRADLE_DIR=$(find . -name "settings.gradle*" -printf "%h\n" | head -n 1)
          echo "Menemukan proyek Android di folder: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SystemRPG-Android-APK
          path: "**/build/outputs/apk/debug/*.apk"

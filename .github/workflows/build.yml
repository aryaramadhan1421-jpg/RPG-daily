name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Otomatis
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          GRADLE_DIR=$(find . -name "settings.gradle*" -printf "%h\n" | head -n 1)
          echo "Menemukan proyek Android di folder: $GRADLE_DIR"
          mkdir -p "$GRADLE_DIR/app"
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$GRADLE_DIR/app/release-key.jks"

      - name: Build Signed Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GRADLE_DIR=$(find . -name "settings.gradle*" -printf "%h\n" | head -n 1)
          cd "$GRADLE_DIR"
          gradle assembleRelease -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SystemRPG-Android-APK
          path: "**/build/outputs/apk/release/*.apk"
